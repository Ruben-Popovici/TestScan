<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TXT File Viewer</title>
    <style>
        body {
            font-family: Arial;
            padding: 30px;
            background: #f4f4f4;
        }

        select {
            padding: 10px;
            font-size: 16px;
            width: 300px;
        }

        #output {
            margin-top: 20px;
            padding: 20px;
            background: white;
            border-radius: 8px;
            min-height: 200px;
            white-space: normal;
            overflow-wrap: break-word;
        }
    </style>
</head>
<body>

    <h2>TXT File Viewer</h2>

    <input type="file" id="folderPicker"
           webkitdirectory multiple accept=".txt">

    <br><br>

    <select id="filePicker" disabled>
        <option value="">Select a text file...</option>
    </select>

    <div id="output">Choose a folder to get started.</div>

    <script>
        const folderPicker = document.getElementById("folderPicker");
        const filePicker = document.getElementById("filePicker");
        const output = document.getElementById("output");

        let txtFiles = [];

        folderPicker.addEventListener("change", function () {
            txtFiles = Array.from(this.files)
                .filter(file => file.name.toLowerCase().endsWith(".txt"));

            filePicker.innerHTML =
                '<option value="">Select a text file...</option>';

            txtFiles.forEach((file, index) => {
                const option = document.createElement("option");
                option.value = index;
                option.textContent = file.name;
                filePicker.appendChild(option);
            });

            filePicker.disabled = txtFiles.length === 0;

            output.textContent = txtFiles.length
                ? "Select a file to display its contents."
                : "No TXT files found.";
        });

        filePicker.addEventListener("change", function () {
            const file = txtFiles[this.value];

            if (!file) return;

            const reader = new FileReader();

            reader.onload = function (event) {
                output.innerHTML = event.target.result
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;")
                    .replace(/\r\n|\r|\n/g, "<br>");
            };

            reader.readAsText(file);
        });
    </script>

</body>
</html>
