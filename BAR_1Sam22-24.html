<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Barem activ</title>
  <h1>1 Samuel 22-24</h1>
<style>
  body{font-family:system-ui,sans-serif;max-width:700px;margin:0 auto;padding:12px}
  .card{border:1px solid #ccc;border-radius:10px;padding:12px;margin:10px 0}
  .nota{background:#fff8dc}
  .opt{padding:4px 8px;margin:3px 0;border-radius:6px}
  .opt.correct{background:#b6f2b0;font-weight:bold;font-size:1.15em;
    border:2px solid #2e9e2e;padding:8px 10px}
  .opt.correct::before{content:"✔ ";color:#1c7a1c}
  .verse{background:#eef6ff;border-left:5px solid #2a6fdb;border-radius:6px;
    color:#123;font-size:1.05em;margin-top:10px;padding:10px 12px;display:none}
  button{margin-top:8px;padding:6px 12px;font-size:1em}
  a{color:#c4302b;font-weight:bold}
</style>
</head>
<body>

<div id="myText"></div>

<script>
// Format: TIP | verset | răspuns | ordine
// TIP = AF, ABC sau NOTA. Capitol nou = linie care începe cu "# ".
// Întrebările se separă printr-o linie goală.
const text = `
NOTA | | | 0
1 Samuel 19:8-17. : 
David, scăpat de Mical
[Apasă aici să vezi un video!](https://youtu.be/N0cGcOuFOUc)

# Capitolul 22

AF | v.2 | F | x
s-au strâns la el şi el a ajuns căpetenia lor. Astfel, s-au unit cu el aproape cinci sute de oameni.
> s-au strâns la el şi el a ajuns căpetenia lor. Astfel, s-au unit cu el aproape *patru* sute de oameni.

AF | v.18,20 | F | x
Doeg a omorât pe toți cei ce purtau efodul de in.
> 18. Atunci, împăratul a zis lui Doeg: „Întoarce-te şi loveşte pe preoţi.” Şi Doeg, Edomitul, s-a întors şi a lovit pe preoţi; a omorât în ziua aceea optzeci şi cinci de oameni care purtau efodul de in. 20.Un fiu al lui Ahimelec, fiul lui Ahitub, a scăpat. Numele lui era Abiatar. A fugit la David

AF | v.7 | F | x
Saul le-a zis slujitorilor săi: „Ascultați, beniamiți! Vă va da fiul lui Isai la toți ogoare și oi?”
> ...ogoare și *vii*?

AF | v.14 | A | x
Ahimelec i-a vorbit împăratului despre „credinciosul David, ginerele împăratului”.

AF | v.18 | F | x
Atunci, împăratul a zis lui Doeg: „Întoarce-te şi loveşte pe Ahimelec.” 
> Atunci, împăratul a zis lui Doeg: „Întoarce-te şi loveşte pe *preoţi*.”

ABC | v.18 | b | x
Câți oameni ar fi omorât Doeg, Edomitul, dacă unul dintre iei n-ar fi scăpat?
> Şi Doeg, Edomitul, s-a întors şi a lovit pe preoţi; a omorât în ziua aceea *optzeci şi cinci de oameni* care purtau efodul de in.
a) 85 de oameni.
b) 86 de oameni.
c) 87 de oameni.

ABC | v.19 | c | x
Care cetate a trecut sub ascuțișul sabiei lui Saul?
a) Rama
b) Cheila
c) Nob

ABC | v.22 | b | x
David i-a zis lui Abiatar: „Eu sunt pricina morții tuturor _____ din casa tatălui tău.”
a) robilor
b) sufletelor
c) fiilor

ABC | v.22 | b | x
La ce s-a găndit David despre Doeg, Edomitul?
> David a zis lui Abiatar: „M-am gândit chiar în ziua aceea că Doeg, Edomitul, fiind acolo, *nu se putea să nu spună lui Saul*. Eu sunt pricina morţii tuturor sufletelor din casa tatălui tău.
a) că va asculta de Saul.
b) că va spune lui Saul despre David.
c) că va ajuta pe Saul să caute pe David.

ABC | v.5 | a | x
______ a spus lui David să se ducă în țara ______?
> Prorocul Gad a zis lui David: „Nu şedea în cetăţuie, ci du-te şi intră în ţara lui Iuda.” Şi David a plecat şi a ajuns la pădurea Heret.
a) Prorocul Gad, lui Iuda
b) Preotul Ahimelec, Moabului
c) Abiatar, filistenilor
`;

// *bold* și _italic_ (nu afectează liniile de completat "_____")
// + linkuri: [text](https://...) sau un link simplu https://...
function fmt(s) {
  const links = [];
  const keep = h => "\u0001" + (links.push(h) - 1) + "\u0002";
  const a = (u, t) =>
    keep(`<a href="${u}" target="_blank" rel="noopener noreferrer">${t}</a>`);
  // linkurile se scot întâi, ca "_" din URL să nu devină italic
  s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, (m, t, u) => a(u, t));
  s = s.replace(/(?<![\w"=\u0001])(https?:\/\/[^\s<)]+)/g, (m, u) =>
    a(u, /youtu\.?be/.test(u) ? "▶ Video YouTube" : u));
  s = s
    .replace(/(?<![*\w])\*([^*\s][^*]*?)\*(?![*\w])/g, "<b>$1</b>")
    .replace(/(?<![_\w])_([^_\s][^_]*?)_(?![_\w])/g, "<i>$1</i>");
  return s.replace(/\u0001(\d+)\u0002/g, (m, i) => links[i]);
}

function parse(text) {
  return text.split(/^# /m).filter(s => s.trim()).map(block => {
    const [title, ...rest] = block.split("\n");
    const questions = rest.join("\n").split(/\n\s*\n/)
      .map(q => q.trim()).filter(Boolean).map(q => {
        const lines = q.split("\n");
        const [type, verse = "", answer = "", order = ""] =
          lines[0].split("|").map(s => s.trim());
        const options = [], body = [], verseLines = [];
        lines.slice(1).forEach(l => {
          const m = l.match(/^([abc])\)\s*(.*)/i);
          if (l.startsWith(">")) verseLines.push(l.slice(1).trim());
          else if (m) options.push({ k: m[1].toLowerCase(), t: m[2] });
          else body.push(l);
        });
        if (type === "AF")
          options.push({ k: "a", t: "Adevărat" }, { k: "f", t: "Fals" });
        const o = parseInt(order);
        return {
          type, verse,
          verseText: verseLines.join(" "),
          answer: answer.toLowerCase(),
          order: isNaN(o) ? null : o,
          text: body.join("<br>"),
          options
        };
      })
      .sort((a, b) => (a.order ?? 999) - (b.order ?? 999));
    return { title: title.trim(), questions };
  });
}

function render(chapters, root) {
  root.innerHTML = "";
  chapters.forEach(ch => {
    const h = document.createElement("h2");
    h.textContent = ch.title;
    root.appendChild(h);
    let n = 0;
    ch.questions.forEach(q => {
      const card = document.createElement("div");
      card.className = "card" + (q.type === "NOTA" ? " nota" : "");
      if (q.type === "NOTA") {
        card.innerHTML = fmt(q.text);
        root.appendChild(card);
        return;
      }
      n++;
      card.innerHTML = `<b>${q.order ?? n}.</b> ${fmt(q.text)}`;
      q.options.forEach(o => {
        const d = document.createElement("div");
        d.className = "opt";
        d.dataset.k = o.k;
        d.innerHTML = (q.type === "ABC" ? o.k + ") " : "") + fmt(o.t);
        card.appendChild(d);
      });
      const btn = document.createElement("button");
      btn.textContent = "Arată răspunsul";
      const v = document.createElement("div");
      v.className = "verse";
      v.innerHTML = `<b>${q.verse}</b>` + (q.verseText ? ` — ${fmt(q.verseText)}` : "");
      btn.onclick = () => {
        const show = !btn.dataset.on;
        btn.dataset.on = show ? "1" : "";
        btn.textContent = show ? "Ascunde răspunsul" : "Arată răspunsul";
        v.style.display = show ? "block" : "none";
        card.querySelectorAll(".opt").forEach(o =>
          o.classList.toggle("correct", show && o.dataset.k === q.answer));
      };
      card.append(btn, v);
      root.appendChild(card);
    });
  });
}

render(parse(text), document.getElementById("myText"));
</script>
</body>
</html>
