<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Barem activ</title>
<style>
  body{font-family:system-ui,sans-serif;max-width:700px;margin:0 auto;padding:12px}
  .card{border:1px solid #ccc;border-radius:10px;padding:12px;margin:10px 0}
  .nota{background:#fff8dc}
  .opt{padding:4px 8px;margin:3px 0;border-radius:6px;border:2px solid transparent}
  .opt.wrong{background:#ffd9d9;border-color:#d62828;color:#8a1111}
  .opt.correct.false{background:#ffd9d9;border-color:#d62828}
  .opt.correct.false::before{color:#d62828}
  .opt.correct{background:#b6f2b0;font-weight:bold;font-size:1.15em;
    border:2px solid #2e9e2e;padding:8px 10px}
  .opt.correct::before{content:"✔ ";color:#1c7a1c}
  .verse{background:#eef6ff;border-left:5px solid #2a6fdb;border-radius:6px;
    color:#123;font-size:1.05em;margin-top:10px;padding:10px 12px;display:none}
  button{margin-top:8px;padding:6px 12px;font-size:1em}
  a{color:#1a5fd0;font-weight:bold}
  .tab{margin:0 6px 0 0;border:1px solid #2a6fdb;background:#fff;color:#2a6fdb;border-radius:8px}
  .tab.active{background:#2a6fdb;color:#fff}
  .opt.pick{cursor:pointer;border-color:#ddd}
  .opt.pick:not(.correct):not(.wrong):hover{background:#f0f4ff}
  #admin input{padding:6px;font-size:1em;margin-right:6px}
  #admin textarea{width:100%;box-sizing:border-box;font-family:monospace;font-size:1.1em;margin-top:8px}
  #admin code{font-size:1.15em}
  .scorebar{position:sticky;top:0;z-index:5;background:#fff;border:2px solid #2a6fdb;
    border-radius:10px;padding:8px 12px;margin:8px 0;font-weight:bold}
  .scorebar.final{background:#eef6ff;font-size:1.15em}
  .scorebar button{margin-top:0}
</style>
</head>
<body>

<div id="tabs">
  <button id="tabBarem" class="tab active">Barem</button>
  <button id="tabTest" class="tab">Test</button>
  <button id="tabAdmin" class="tab">Admin</button>
</div>

<div id="myText"></div>
<div id="test" style="display:none"></div>
<div id="admin" style="display:none"></div>

<script>
// Format: TIP | verset | răspuns | ordine
// TIP = AF, ABC sau NOTA. Capitol nou = linie care începe cu "# ".
// Întrebările se separă printr-o linie goală.
const text = `


# Capitolul 25

NOTA | | |
Se recomandă reparcurgerea capitolului de mai multe ori din pricina lungimei acestuia.

AF | v.3 | F | 1
Samuel a murit. Tot Israelul s-a adunat şi l-a plâns şi l-au îngropat în locuinţa lui, lângă cetate.
> Samuel a murit. Tot Israelul s-a adunat şi l-a plâns şi l-au îngropat în locuinţa lui, *la Rama*. 

AF | v.8 | F | 2
Solii trebuiau să spună: „Să capete trecere, dar, tinerii aceștia înaintea ta, fiindcă venim într-o zi de belșug.”
> Întreabă pe slujitorii tăi, şi-ţi vor spune. Să capete trecere dar tinerii aceştia înaintea ta, fiindcă venim într-o zi *de bucurie*. Dă dar, te rog, robilor tăi şi fiului tău David ce te lasă inima.’”

AF | v.31 | A | 3
„atunci nu va avea domnul meu nici mustrări de cuget şi nici nu-l va durea inima că a vărsat sânge degeaba şi că s-a răzbunat singur.”
> atunci nu va avea domnul meu nici mustrări de cuget şi nici nu-l va durea inima că a vărsat sânge degeaba şi că s-a răzbunat singur. Şi când va face Domnul bine domnului meu, adu-ţi aminte de roaba ta.”

AF | v.44 | F | 4
„Saul dăduse pe fiica sa Mical, nevasta lui David, lui Palti din Galim, fiul lui Chiș.”
> Şi Saul dăduse pe fiică-sa Mical, nevasta lui David, *lui Palti din Galim, fiul lui Laiş*.

AF | v.42 | F | 5
Şi îndată, Abigail a plecat, călare pe un cal şi însoţită de șase fete; a mers după solii lui David şi i-a fost nevastă.
> Şi îndată, Abigail a plecat, călare pe un *măgar* şi însoţită de *cinci* fete; a mers după solii lui David şi i-a fost nevastă.

ABC | v.2 | a | 6
Ce avea Nabal?
> În Maon era un om foarte bogat, a cărui avere era în Carmel; avea *trei mii de oi* şi *o mie de capre* şi se afla la Carmel pentru tunderea oilor lui.
a) trei mii de oi.
b) două mii de capre.
c) ambele răspunsuri.

ABC | v.1 | b | 7
În ce pustiu s-a coborât David, după moartea lui Samuel?
> Samuel a murit. Tot Israelul s-a adunat şi l-a plâns şi l-au îngropat în locuinţa lui, la Rama. Atunci, _David s-a sculat şi s-a coborât în *pustia Paran*_.
a) în pustia Zif.
b) în pustia Paran.
c) în pustia Maon.

ABC | v.20,36 | a | 8
Cum era drumul în care a încălecat Abigail către David? Ce facea Nabal când Abigail s-a întors?
> 20. Ea a încălecat pe un măgar, a coborât muntele pe un drum tufos şi iată că David şi oamenii lui se coborau în faţa ei, aşa că i-a întâlnit.  36. Abigail a ajuns la Nabal. Şi tocmai el dădea în casa lui un ospăţ ca un ospăţ împărătesc; 
a) Drumul era tufos. Facea un ospăț.
b) Drumul era întunecos. Era la masă. 
c) Drumul era greu. Tundea oile.

ABC | v.37 | c | 9
După ce trecuse beția lui Nabal, ce a pățit când a aflat ce făcuse Abigail?
> Dar dimineaţa, după ce trecuse beţia lui Nabal, nevastă-sa i-a istorisit ce se întâmplase. Inima lui Nabal a primit o lovitură de moarte şi s-a făcut ca o piatră.
a) murise îndată.
b) s-a supărat foarte tare.
c) inima lui s-a făcut ca o piatră.

ABC | v.1,3 | c | 10
Nabal se trăgea din ______, el locuia în ______ și toată averea lui era la _________.
> 1. În *Maon* era un om foarte bogat, a cărui avere era în *Carmel*; avea trei mii de oi şi o mie de capre şi se afla la Carmel pentru tunderea oilor lui. 3. El se trăgea din *Caleb*. 
a) Abișai, pustia Paran, Carmel.
b) Caleb, pustia Zif, pustia Paran.
c) Caleb, pustia Maon, Carmel.

# Capitolul 26

`;

// *bold* și _italic_ (nu afectează liniile de completat "_____")
// + linkuri: [text](https://...) sau un link simplu https://...
function fmt(s) {
  const links = [];
  const keep = h => "\u0001" + (links.push(h) - 1) + "\u0002";
  const a = (u, t) =>
    keep(`<a href="${u}" target="_blank" rel="noopener noreferrer">${t}</a>`);
  // linkurile se scot întâi, ca "_" din URL să nu devină italic
  s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, (m, t, u) => a(u, t));
  s = s.replace(/(?<![\w"=\u0001])(https?:\/\/[^\s<)]+)/g, (m, u) =>
    a(u, /youtu\.?be/.test(u) ? "▶ Video YouTube" : u));
  s = s
    .replace(/(?<![*\w])\*([^*\s][^*]*?)\*(?![*\w])/g, "<b>$1</b>")
    .replace(/(?<![_\w])_([^_\s][^_]*?)_(?![_\w])/g, "<i>$1</i>");
  return s.replace(/\u0001(\d+)\u0002/g, (m, i) => links[i]);
}

function parse(text) {
  return text.split(/^# /m).filter(s => s.trim()).map(block => {
    const [title, ...rest] = block.split("\n");
    const questions = rest.join("\n").split(/\n\s*\n/)
      .map(q => q.trim()).filter(Boolean).map(q => {
        const lines = q.split("\n");
        const [type, verse = "", answer = "", order = ""] =
          lines[0].split("|").map(s => s.trim());
        const options = [], body = [], verseLines = [];
        lines.slice(1).forEach(l => {
          const m = l.match(/^([abc])\)\s*(.*)/i);
          if (l.startsWith(">")) verseLines.push(l.slice(1).trim());
          else if (m) options.push({ k: m[1].toLowerCase(), t: m[2] });
          else body.push(l);
        });
        if (type === "AF")
          options.push({ k: "a", t: "Adevărat" }, { k: "f", t: "Fals" });
        const o = parseInt(order);
        return {
          type, verse,
          verseText: verseLines.join(" "),
          answer: answer.toLowerCase(),
          order: isNaN(o) ? null : o,
          text: body.join("<br>"),
          options
        };
      })
      .sort((a, b) => (a.order ?? 999) - (b.order ?? 999));
    return { title: title.trim(), questions };
  });
}

// ===== SCOR (doar în fila Test) =====
// Scor = BASE + POINTS × răspunsuri corecte → cu 30 de întrebări: de la 10 la 100.
// Capitolele cu "recapitulare" în titlu nu se punctează.
const BASE = 10, POINTS = 3;
const scored = ch => !/recapitulare/i.test(ch.title);
const score = { correct: 0, answered: 0, total: 0 };
let scoreBar = null, scoreTxt = null;

function updateScore() {
  if (!scoreBar) return;
  const now = BASE + POINTS * score.correct;
  const max = BASE + POINTS * score.total;
  const finished = score.total > 0 && score.answered === score.total;
  scoreBar.classList.toggle("final", finished);
  scoreTxt.textContent = (finished ? "Scor final: " : "Scor curent: ") + now + " / " + max +
    "  ·  Răspunsuri: " + score.answered + "/" + score.total +
    "  ·  Corecte: " + score.correct;
}

function render(chapters, root, mode = "barem") {
  root.innerHTML = "";
  if (mode === "test") {
    score.correct = 0;
    score.answered = 0;
    score.total = chapters.reduce((t, ch) =>
      t + (scored(ch) ? ch.questions.filter(q => q.type !== "NOTA").length : 0), 0);
    scoreBar = document.createElement("div");
    scoreBar.className = "scorebar";
    scoreTxt = document.createElement("span");
    const again = document.createElement("button");
    again.textContent = "Reia testul";
    again.style.marginLeft = "12px";
    again.onclick = () => { render(chapters, root, "test"); window.scrollTo(0, 0); };
    scoreBar.append(scoreTxt, again);
    root.appendChild(scoreBar);
    updateScore();
  }
  chapters.forEach(ch => {
    const h = document.createElement("h2");
    h.textContent = ch.title + (mode === "test" && !scored(ch) ? " — nepunctat" : "");
    root.appendChild(h);
    let n = 0;
    ch.questions.forEach(q => {
      const card = document.createElement("div");
      card.className = "card" + (q.type === "NOTA" ? " nota" : "");
      if (q.type === "NOTA") {
        card.innerHTML = fmt(q.text);
        root.appendChild(card);
        return;
      }
      n++;
      card.innerHTML = `<b>${q.order ?? n}.</b> ${fmt(q.text)}`;
      q.options.forEach(o => {
        const d = document.createElement("div");
        d.className = "opt" + (mode === "test" ? " pick" : "");
        d.dataset.k = o.k;
        d.innerHTML = (q.type === "ABC" ? o.k + ") " : "") + fmt(o.t);
        card.appendChild(d);
      });
      const v = document.createElement("div");
      v.className = "verse";
      v.innerHTML = `<b>${q.verse}</b>` + (q.verseText ? ` — ${fmt(q.verseText)}` : "");

      if (mode === "test") {
        // TEST: apeși o variantă; corect = verde, greșit = roșu
        const opts = [...card.querySelectorAll(".opt")];
        const counts = scored(ch);
        let done = false;
        opts.forEach(d => d.onclick = () => {
          if (done) return;          // un singur răspuns per întrebare
          done = true;
          const good = d.dataset.k === q.answer;
          d.classList.add(good ? "correct" : "wrong");
          if (!good) opts.find(x => x.dataset.k === q.answer).classList.add("correct");
          v.style.display = "block";
          if (counts) {
            score.answered++;
            if (good) score.correct++;
            updateScore();
          }
        });
        card.append(v);
        root.appendChild(card);
        return;
      }

      const btn = document.createElement("button");
      btn.textContent = "Arată răspunsul";
      btn.onclick = () => {
        const show = !btn.dataset.on;
        btn.dataset.on = show ? "1" : "";
        btn.textContent = show ? "Ascunde răspunsul" : "Arată răspunsul";
        v.style.display = show ? "block" : "none";
        card.querySelectorAll(".opt").forEach(o => {
          const ok = o.dataset.k === q.answer;
          o.classList.toggle("correct", show && ok);
          // A/F: când răspunsul e Fals, bordura e roșie
          o.classList.toggle("false", show && ok && q.type === "AF" && q.answer === "f");
          // ABC: cele 2 variante greșite apar în roșu
          o.classList.toggle("wrong", show && !ok && q.type === "ABC");
        });
      };
      card.append(btn, v);
      root.appendChild(card);
    });
  });
}

const chapters = parse(text);
render(chapters, document.getElementById("myText"), "barem");
render(chapters, document.getElementById("test"), "test");

// ================= ADMIN =================
// Codul tău pentru fila Admin: schimbă-l aici.
const ADMIN_CODE = "260609";

// ex. "AFFAA bacac": A/F cu majuscule, apoi a/b/c cu litere mici, în ordinea afișată
function keyOf(ch) {
  const qs = ch.questions.filter(q => q.type !== "NOTA");
  const af = qs.filter(q => q.type === "AF").map(q => q.answer.toUpperCase()).join("");
  const abc = qs.filter(q => q.type === "ABC").map(q => q.answer.toLowerCase()).join("");
  return (af + " " + abc).trim();
}

function copyText(t, btn) {
  const old = btn.textContent;
  const done = () => { btn.textContent = "Copiat ✔"; setTimeout(() => btn.textContent = old, 1500); };
  const fallback = () => {
    const ta = document.createElement("textarea");
    ta.value = t; document.body.appendChild(ta); ta.select();
    document.execCommand("copy"); ta.remove(); done();
  };
  if (navigator.clipboard) navigator.clipboard.writeText(t).then(done, fallback);
  else fallback();
}

const adminBox = document.getElementById("admin");

function showKey() {
  adminBox.innerHTML = "";
  const lines = chapters.map(keyOf);
  const full = "BAREM COMPLET:\n" + lines.join("\n");
  const ta = document.createElement("textarea");
  ta.readOnly = true; ta.rows = lines.length + 1; ta.value = full;
  const all = document.createElement("button");
  all.textContent = "Copiază tot";
  all.onclick = () => copyText(full, all);
  adminBox.append(ta, all);
  chapters.forEach((ch, i) => {
    const row = document.createElement("div");
    row.className = "card";
    row.innerHTML = `<b>${ch.title}</b>: <code>${lines[i]}</code> `;
    const b = document.createElement("button");
    b.textContent = "Copiază";
    b.onclick = () => copyText(lines[i], b);
    row.appendChild(b);
    // lista detaliată: număr, răspuns, verset
    const det = document.createElement("div");
    det.style.marginTop = "8px";
    det.innerHTML = ch.questions.filter(q => q.type !== "NOTA").map((q, k) =>
      `${q.order ?? k + 1}. <b>${q.type === "AF" ? q.answer.toUpperCase() : q.answer}</b> <span style="color:#666">${q.verse}</span>`
    ).join("<br>");
    row.appendChild(det);
    adminBox.appendChild(row);
  });
}

function buildAdmin() {
  adminBox.innerHTML = "";
  const inp = document.createElement("input");
  inp.type = "password";
  inp.placeholder = "Codul tău";
  const go = document.createElement("button");
  go.textContent = "Deschide";
  const msg = document.createElement("div");
  msg.style.marginTop = "10px";
  go.onclick = () => {
    if (inp.value === ADMIN_CODE) showKey();
    else msg.textContent = "Cod greșit.";
  };
  inp.onkeydown = e => { if (e.key === "Enter") go.click(); };
  adminBox.append(inp, go, msg);
  inp.focus();
}

function openTab(which) {
  document.getElementById("myText").style.display = which === "barem" ? "" : "none";
  document.getElementById("test").style.display = which === "test" ? "" : "none";
  adminBox.style.display = which === "admin" ? "" : "none";
  document.getElementById("tabBarem").classList.toggle("active", which === "barem");
  document.getElementById("tabTest").classList.toggle("active", which === "test");
  document.getElementById("tabAdmin").classList.toggle("active", which === "admin");
  if (which === "admin") buildAdmin();
}
document.getElementById("tabBarem").onclick = () => openTab("barem");
document.getElementById("tabTest").onclick = () => openTab("test");
document.getElementById("tabAdmin").onclick = () => openTab("admin");
</script>
</body>
</html>
